<section class="network-section">

  <!-- Section Header -->
  <div class="network-header">
    <span class="network-eyebrow">
      <i class="fa fa-map-marker-alt"></i> Our Delhi Centers
    </span>
    <h2 class="network-title">Expert TB &amp; Chest Care Across Delhi</h2>
    <p class="network-subtitle">
      Five specialized clinics delivering accurate diagnosis, advanced treatment
      and compassionate care &mdash; closer to you.
    </p>
  </div>

  <!-- Interactive Map -->
  <div class="network-locator">
    <div class="delhi-map-container">
      <img src="assets/images/delhi-map.png" alt="Delhi TB Clinic Network Map" class="delhi-map-image">

      <button *ngFor="let loc of hospitalLocations; let i = index"
        type="button"
        class="map-pin"
        [class.active]="activeIndex === i"
        [style.top]="mapPinPositions[i].top"
        [style.left]="mapPinPositions[i].left"
        (click)="scrollToBranch(i)"
        (mouseenter)="setActive(i)"
        (mouseleave)="setActive(null)"
        (focus)="setActive(i)"
        (blur)="setActive(null)"
        [attr.aria-label]="'Go to ' + loc.branchName">
        <span class="map-pin-number">{{ i + 1 }}</span>
        <span class="map-pin-tooltip">{{ loc.branchName }}</span>
      </button>

      <!-- Compass -->
      <div class="map-compass" aria-hidden="true">
        <span class="compass-n">N</span>
        <span class="compass-arrow">&#9650;</span>
      </div>
    </div>
  </div>

  <!-- Branch Cards -->
  <div class="locations-carousel">
    <div class="carousel-track">
      <div class="location-card"
        *ngFor="let loc of hospitalLocations; let i = index"
        [id]="'branch-' + i"
        [class.active]="activeIndex === i"
        (mouseenter)="setActive(i)"
        (mouseleave)="setActive(null)">

        <div class="card-head">
          <span class="card-number">{{ i + 1 }}</span>
          <h3 class="branch-name-header">{{ loc.branchName }}</h3>
        </div>

        <p class="address-line">{{ loc.addressLine }}</p>

        <div class="card-features">
          <span class="feature-item"><i class="fa fa-user-md"></i> Expert Doctors</span>
          <span class="feature-item"><i class="fa fa-x-ray"></i> Digital X-Ray</span>
          <span class="feature-item"><i class="fa fa-vial"></i> Lab Services</span>
        </div>

        <a href="https://www.google.com/maps/search/?api=1&query={{ loc.addressLine | urlEncode }}"
           target="_blank"
           rel="noopener"
           class="btn-get-directions">
          <i class="fa fa-map-marker-alt"></i> Get Directions
          <i class="fa fa-external-link-alt directions-ext"></i>
        </a>

      </div>
    </div>
  </div>

</section>
