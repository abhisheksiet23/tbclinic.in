<section class="testimonials-section">
  <div class="container">

    <div class="section-header">
      <span class="section-label">Patient Stories</span>
      <h2>What Our Patients Say</h2>
      <div class="title-underline"></div>
      <p class="testimonial-intro">
        Real reviews from patients on their TB care journey.
      </p>
    </div>

    <!-- Aggregate rating — the credibility anchor for everything below it -->
    <div class="rating-summary">
      <div class="rating-score">
        <span class="rating-value">4.85</span>
        <span class="rating-outof">/ 5</span>
      </div>

      <div class="rating-meta">
        <div class="rating-stars" role="img" aria-label="Rated 4.85 out of 5">
          <span class="stars-track" aria-hidden="true">★★★★★</span>
          <span class="stars-fill" aria-hidden="true">★★★★★</span>
        </div>
        <span class="rating-count">2,000+ verified reviews</span>
      </div>

      <div class="rating-source">
        <img src="assets/google-icon.png" alt="" class="google-icon" width="20" height="20">
        <span>on <strong>Google</strong></span>
      </div>
    </div>

    <!-- Defined once, rendered twice: overlaid on the card on phones, in the
         control row on larger screens. CSS shows exactly one set per breakpoint. -->
    <ng-template #prevButton>
      <button class="nav-button" (click)="prevSlide()" aria-label="Previous testimonial">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
    </ng-template>

    <ng-template #nextButton>
      <button class="nav-button" (click)="nextSlide()" aria-label="Next testimonial">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </ng-template>

    <div
      class="carousel-container"
      (mouseenter)="stopAutoScroll()"
      (mouseleave)="startAutoScroll()"
    >
      <!-- Active card centred, neighbours peek in from both sides and loop endlessly -->
      <div
        class="slides-wrapper"
        (touchstart)="onTouchStart($event)"
        (touchend)="onTouchEnd($event)"
      >
        <div
          class="testimonial-slider"
          [style.transform]="trackTransform"
          [style.transition]="transitionEnabled ? null : 'none'"
          (transitionend)="onTransitionEnd($event)"
        >
          @for (testimonial of slides; track $index; let i = $index) {
            <div class="testimonial-card" [class.is-active]="i === position">
              <figure
                class="card-content"
                [attr.aria-hidden]="i === position ? null : 'true'"
                [attr.inert]="i === position ? null : ''"
              >
                <div class="card-top">
                  <span class="quote-mark" aria-hidden="true">&ldquo;</span>
                  <span class="card-stars" role="img" aria-label="Rated 5 out of 5">★★★★★</span>
                </div>

                <blockquote class="quote-text">{{ testimonial.quote }}</blockquote>

                <figcaption class="author-section">
                  <span class="author-avatar" aria-hidden="true">{{ testimonial.name.charAt(0).toUpperCase() }}</span>
                  <span class="author-details">
                    <span class="author-name">{{ testimonial.name }}</span>
                    <span class="author-title">
                      Recovered Patient
                      <span class="verified-tick" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                          <path d="M12 2l2.2 1.6 2.7-.3 1.1 2.5 2.4 1.3-.6 2.6.6 2.6-2.4 1.3-1.1 2.5-2.7-.3L12 18l-2.2-1.6-2.7.3-1.1-2.5L3.6 13l.6-2.6-.6-2.6 2.4-1.3 1.1-2.5 2.7.3L12 2zm-1 12.2l5-5-1.4-1.4-3.6 3.6-1.8-1.8L7.8 11l3.2 3.2z"/>
                        </svg>
                        Verified
                      </span>
                    </span>
                  </span>
                </figcaption>
              </figure>
            </div>
          }
        </div>
      </div>

      <!-- Phones: arrows hug the card edges, level with the quote -->
      <div class="side-nav side-nav--prev">
        <ng-container *ngTemplateOutlet="prevButton"></ng-container>
      </div>
      <div class="side-nav side-nav--next">
        <ng-container *ngTemplateOutlet="nextButton"></ng-container>
      </div>
    </div>

    <!-- Controls: progress through the set, plus the arrows on larger screens -->
    <div class="carousel-controls">
      <ng-container *ngTemplateOutlet="prevButton"></ng-container>

      <div
        class="progress-track"
        role="progressbar"
        [attr.aria-valuenow]="currentSlideIndex + 1"
        aria-valuemin="1"
        [attr.aria-valuemax]="testimonials.length"
        [attr.aria-label]="'Review ' + (currentSlideIndex + 1) + ' of ' + testimonials.length"
      >
        <span class="progress-fill" [style.width.%]="progressPercent"></span>
      </div>

      <ng-container *ngTemplateOutlet="nextButton"></ng-container>
    </div>

  </div>
</section>
